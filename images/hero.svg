<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Modern architecture skyline">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F3E46"/>
      <stop offset="0.55" stop-color="#26333a"/>
      <stop offset="1" stop-color="#1E1E1E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A85A3A" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#A85A3A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4c56"/>
      <stop offset="1" stop-color="#1a2429"/>
    </linearGradient>
    <linearGradient id="buildingLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46606d"/>
      <stop offset="1" stop-color="#233038"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- faint construction grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="1080"/>
    <line x1="720" y1="0" x2="720" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1680" y1="0" x2="1680" y2="1080"/>
  </g>

  <!-- sun / accent orb -->
  <circle cx="1500" cy="300" r="140" fill="#D9A441" fill-opacity="0.12"/>
  <circle cx="1500" cy="300" r="80" fill="#D9A441" fill-opacity="0.14"/>

  <!-- skyline -->
  <g>
    <rect x="60" y="560" width="150" height="520" fill="url(#building)"/>
    <rect x="230" y="470" width="120" height="610" fill="url(#buildingLight)"/>
    <rect x="370" y="640" width="170" height="440" fill="url(#building)"/>
    <rect x="560" y="380" width="140" height="700" fill="url(#buildingLight)"/>
    <rect x="720" y="520" width="150" height="560" fill="url(#building)"/>
    <rect x="890" y="300" width="130" height="780" fill="url(#buildingLight)"/>
    <rect x="1040" y="600" width="180" height="480" fill="url(#building)"/>
    <rect x="1240" y="440" width="140" height="640" fill="url(#buildingLight)"/>
    <rect x="1400" y="560" width="150" height="520" fill="url(#building)"/>
    <rect x="1570" y="360" width="130" height="720" fill="url(#buildingLight)"/>
    <rect x="1720" y="600" width="150" height="480" fill="url(#building)"/>
    <!-- crane -->
    <g stroke="#D9A441" stroke-opacity="0.55" stroke-width="6" fill="none">
      <line x1="960" y1="120" x2="960" y2="300"/>
      <line x1="820" y1="180" x2="1120" y2="180"/>
      <line x1="960" y1="120" x2="1120" y2="180"/>
      <line x1="960" y1="120" x2="860" y2="180"/>
      <line x1="1090" y1="180" x2="1090" y2="230"/>
    </g>
  </g>

  <!-- window lights -->
  <g fill="#D9A441" fill-opacity="0.5">
    <rect x="255" y="510" width="14" height="18"/><rect x="285" y="510" width="14" height="18"/><rect x="315" y="560" width="14" height="18"/>
    <rect x="585" y="430" width="14" height="18"/><rect x="615" y="470" width="14" height="18"/><rect x="645" y="430" width="14" height="18"/>
    <rect x="915" y="350" width="14" height="18"/><rect x="945" y="400" width="14" height="18"/><rect x="975" y="350" width="14" height="18"/>
    <rect x="1265" y="490" width="14" height="18"/><rect x="1295" y="540" width="14" height="18"/><rect x="1325" y="490" width="14" height="18"/>
    <rect x="1595" y="410" width="14" height="18"/><rect x="1625" y="460" width="14" height="18"/><rect x="1655" y="410" width="14" height="18"/>
  </g>
</svg>
