<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEC Construction - Premium Loader</title>
  <!-- Google Fonts for Outfit Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       GLOBAL SETUP & THEME VARIABLES
       ========================================== */
    :root {
      --bg-color: #1E1E1E;
      --primary-blue: #A85A3A;
      --white: #FFFFFF;
      --accent-glow: #D9A441;
      --glow-shadow: rgba(168, 90, 58, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Outfit', 'Montserrat', 'Poppins', sans-serif;
      overflow: hidden;
    }

    /* Container setup - Ready for overlay/transparent integration */
    .loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .loader-container {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================
       1. OUTER ROTATING RING & PARTICLES
       ========================================== */
    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid rgba(217, 164, 65, 0.15);
      border-top: 1.5px solid var(--primary-blue);
      border-right: 1.5px solid var(--accent-glow);
      filter: drop-shadow(0 0 8px var(--glow-shadow));
      animation: rotateRing 3.5s linear infinite;
    }

    /* Subtle Architectural Grid Lines Overlay */
    .grid-overlay {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background-image: 
        linear-gradient(rgba(217, 164, 65, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(217, 164, 65, 0.06) 1px, transparent 1px);
      background-size: 15px 15px;
      background-position: center;
      opacity: 0;
      animation: fadeIn 0.8s ease-out forwards 0.2s;
    }

    /* Orbiting Particle */
    .orbit-particle {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      animation: rotateRing 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .orbit-particle::before {
      content: '';
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background-color: var(--accent-glow);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-glow), 0 0 18px var(--primary-blue);
    }

    /* ==========================================
       2. SVG BLUEPRINT HOUSE ANIMATIONS
       ========================================== */
    .house-svg {
      width: 120px;
      height: 120px;
      z-index: 2;
      filter: drop-shadow(0 0 10px rgba(168, 90, 58, 0.5));
      animation: subtlePulse 3s ease-in-out infinite 2.8s;
    }

    /* Common Stroke Styles */
    .blueprint-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Foundation & Walls Draw */
    .wall-lines {
      stroke: var(--primary-blue);
      stroke-width: 2;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: drawLines 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.4s;
    }

    /* Roof Draw */
    .roof-lines {
      stroke: var(--accent-glow);
      stroke-width: 2.5;
      stroke-dasharray: 180;
      stroke-dashoffset: 180;
      animation: drawLines 1s cubic-bezier(0.4, 0, 0.2, 1) forwards 1.4s;
    }

    /* Door & Windows Draw */
    .detail-lines {
      stroke: var(--white);
      stroke-width: 1.5;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawLines 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards 2.2s;
    }

    /* Construction Guide Lines (Dotted Blueprint feel) */
    .guide-lines {
      stroke: rgba(217, 164, 65, 0.35);
      stroke-width: 1;
      stroke-dasharray: 2 4;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards 0.2s;
    }

    /* ==========================================
       3. TYPOGRAPHY & BRANDING
       ========================================== */
    .brand-name {
      margin-top: 32px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 12px var(--glow-shadow), 0 0 24px rgba(217, 164, 65, 0.3);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUpText 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 2.6s;
    }

    /* ==========================================
       KEYFRAME ANIMATIONS
       ========================================== */
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes drawLines {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes fadeUpText {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes subtlePulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(168, 90, 58, 0.5));
      }
      50% {
        transform: scale(1.03);
        filter: drop-shadow(0 0 18px rgba(217, 164, 65, 0.8));
      }
    }
  </style>
</head>
<body>

  <div class="loader-wrapper">
    <!-- Loader Graphic Container -->
    <div class="loader-container">
      <!-- Rotating Outer Glow Ring -->
      <div class="outer-ring"></div>
      
      <!-- Particle Orbit -->
      <div class="orbit-particle"></div>

      <!-- Architectural Grid Layer -->
      <div class="grid-overlay"></div>

      <!-- Vector Blueprint SVG House -->
      <svg class="house-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Vertical & Horizontal Axis Construction Lines -->
        <line class="guide-lines" x1="10" y1="82" x2="90" y2="82" />
        <line class="guide-lines" x1="50" y1="10" x2="50" y2="90" />

        <!-- 1. Base Ground & Main Walls -->
        <path class="blueprint-line wall-lines" d="M 22 82 H 78 V 48 H 22 Z" />

        <!-- 2. Minimalist Roof Structure -->
        <path class="blueprint-line roof-lines" d="M 16 48 L 50 20 L 84 48" />

        <!-- 3. Glass Windows & Entrance Door -->
        <!-- Door -->
        <path class="blueprint-line detail-lines" d="M 43 82 V 62 H 57 V 82" />
        <!-- Window Left -->
        <path class="blueprint-line detail-lines" d="M 28 56 H 38 V 66 H 28 Z" />
        <!-- Window Right -->
        <path class="blueprint-line detail-lines" d="M 62 56 H 72 V 66 H 62 Z" />
      </svg>
    </div>

    <!-- Company Branding -->
    <div class="brand-name">AEC Construction</div>
  </div>

</body>
</html>
